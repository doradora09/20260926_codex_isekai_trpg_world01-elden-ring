<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1118">
<meta name="description" content="先生一人、生徒三十二人。期限は百日。ゲーム知識で異世界転生してみた — 第1世界・エルデンリング編、約1分のオープニング。">
<title>旅のはじまり｜異世界転移録・オープニング</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 16 16 29 4 16Z' fill='%230b1118' stroke='%23d5b876'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--ink:#0b1118;--paper:#f5f0e4;--gold:#d8bb7f;--muted:#b3b9bd;--line:#d8bb7f40;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper)}button,a,input{touch-action:manipulation}button,a{color:inherit}button{font:inherit;cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:5px}button{border:1px solid var(--line);background:#101821c9;border-radius:4px;padding:10px 16px}button:hover,a:hover{color:#ffe0a3}button:disabled{opacity:.35;cursor:default}[hidden]{display:none!important}.serif,h1,h2{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;font-weight:400}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);line-height:1.8}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#experience{position:relative;height:100svh;min-height:540px;overflow:hidden;background:#0b1118;isolation:isolate}#experience:fullscreen{height:100vh}.topbar{position:absolute;z-index:8;inset:0 0 auto;min-height:64px;padding:20px clamp(20px,4vw,64px);display:flex;justify-content:space-between;gap:18px;align-items:center;background:linear-gradient(#080e17c9,transparent);font-size:12px;letter-spacing:.08em}.brand{display:flex;align-items:center;gap:12px}.brand:before{content:"";display:block;width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg)}.topbar a{color:#eee4d1;border-bottom:1px solid #f5f0e444;padding:6px 0}
.poster{position:absolute;inset:0;z-index:7;display:grid;align-content:center;padding:80px clamp(26px,9vw,150px) 115px;background:linear-gradient(90deg,#060e16ed,#060e1695 55%,#060e1633),url('assets/elden-limgrave-turn-1-4.webp') center/cover}.poster:after,.stage:after{content:"";position:absolute;inset:80px 24px 97px;border:1px solid #e3c69020;pointer-events:none}.poster .eyebrow{margin:0 0 24px}.poster h1{font-size:clamp(36px,4.7vw,74px);line-height:1.55;letter-spacing:.08em;margin:0 0 12px;text-shadow:0 3px 35px #000}.poster .with{color:var(--gold);font-size:15px;letter-spacing:.3em;margin:12px 0 28px}.poster .lead{line-height:2;font-size:14px;color:#e0dbd1;margin:0 0 30px}.actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.primary{display:inline-flex;align-items:center;justify-content:center;gap:28px;background:var(--gold);color:#131a22!important;border:1px solid var(--gold);padding:15px 25px;min-height:52px;font-size:14px;letter-spacing:.1em}.primary:hover{background:#efd3a0}.secondary{font-size:13px;border-bottom:1px solid #b8b0a366;padding:7px 0}.poster .note{font-size:11px;letter-spacing:.06em;color:#b4b7b7;margin-top:22px}
.stage,.scene,.scene img,.classroom,.shade{position:absolute;inset:0;width:100%;height:100%}.stage{overflow:hidden}.scene{opacity:0;visibility:hidden;transition:opacity .75s ease,visibility .75s;overflow:hidden}.scene.current{opacity:1;visibility:visible}.scene img{object-fit:cover;object-position:var(--focus,50% 50%);will-change:transform}.shade{background:linear-gradient(180deg,#070f1930 5%,transparent 35%,#070d16b3 66%,#070d16f5 100%)}.scene.center .shade{background:linear-gradient(90deg,#060e1670,#060e1660),linear-gradient(transparent 30%,#060e16de)}.scene.red .shade{background:linear-gradient(transparent 20%,#17090bdc 70%,#100b12)}.caption{position:absolute;left:clamp(28px,8vw,130px);right:clamp(28px,8vw,130px);bottom:clamp(146px,18vh,210px);max-width:1100px;z-index:2;text-shadow:0 2px 20px #0009}.caption h2{font-size:clamp(30px,4.2vw,66px);line-height:1.55;letter-spacing:.07em;margin:10px 0 16px;overflow-wrap:anywhere}.caption p{font-size:clamp(13px,1.35vw,18px);line-height:2;letter-spacing:.06em;margin:0;color:#e2ded5}.center .caption{text-align:center;max-width:none;bottom:26%;}.center .caption h2{font-size:clamp(36px,5.4vw,88px)}.title-scene .caption h2{font-size:clamp(34px,5vw,76px);line-height:1.55}.title-scene .caption{bottom:25%}.title-scene .caption p{font-size:14px;letter-spacing:.23em;color:var(--gold)}.end-actions{margin-top:24px;justify-content:center}.final-note{margin-top:15px!important;font-size:11px!important;color:#c2c3c1!important;letter-spacing:.08em!important}.classroom{background:radial-gradient(ellipse at 20% 30%,#c8d7c32a,transparent 60%),#14212a}.classroom svg{width:100%;height:100%;object-fit:cover}.classroom+.shade{background:linear-gradient(#0a131550,#090e18b5)}
.controls{position:absolute;inset:auto 0 0;z-index:10;padding:12px clamp(20px,4vw,64px) 18px;background:linear-gradient(transparent,#090f18ee 30%);opacity:1}.control-row{display:flex;align-items:center;gap:14px}.control-row button{font-size:12px;min-height:38px;padding:8px 13px}.control-row .spacer{flex:1}.time{font-size:11px;font-variant-numeric:tabular-nums;color:#c1c5c5;white-space:nowrap}#progress{display:block;width:100%;height:18px;margin:0 0 8px;accent-color:var(--gold);cursor:pointer}#motionLabel{display:flex;align-items:center;gap:5px;font-size:11px;color:#c3c6c6;white-space:nowrap}input[type=checkbox]{accent-color:var(--gold)}.chapter-dots{display:flex;gap:6px;align-items:center}.chapter-dots button{padding:10px 4px;border:0;background:transparent;min-height:32px;width:22px;position:relative}.control-row .chapter-dots button{width:28px;padding:10px 5px}.chapter-dots button:after{content:"";display:block;height:3px;background:#e3d1b047;width:100%}.chapter-dots button[aria-current=true]:after{background:var(--gold)}.initial .controls{display:none}#status{position:absolute;left:28px;bottom:118px;font-size:12px;z-index:12;color:#ded5c0}noscript{position:relative;z-index:20;padding:24px;background:#111a24;display:block}noscript a{color:var(--gold)}
@media(max-width:700px){#experience{min-height:560px}.topbar{font-size:10px;padding:17px 20px;min-height:56px}.poster{padding:90px 30px 110px;background-position:62% 50%}.poster h1{font-size:clamp(31px,7.8vw,47px)}.poster .eyebrow{font-size:10px;margin-bottom:18px}.poster .lead{font-size:13px}.poster:after,.stage:after{inset:66px 12px 117px}.caption{left:28px;right:28px;bottom:180px}.caption h2{font-size:clamp(27px,6.5vw,40px)}.caption p{font-size:13px}.center .caption{bottom:31%}.center .caption h2{font-size:40px}.title-scene .caption{bottom:29%}.title-scene .caption h2{font-size:clamp(28px,6.5vw,40px)}.title-scene .caption p{font-size:11px}.controls{padding:12px 18px 15px}.control-row{gap:9px;flex-wrap:wrap}.control-row .spacer{display:none}.chapter-dots{order:5;flex:1}.time{margin-right:auto}.control-row button{font-size:11px;padding:8px 10px}#motionLabel{font-size:10px}.end-actions{gap:16px}.end-actions .primary{padding:13px 18px;font-size:12px}.scene img{object-position:var(--mobile-focus,var(--focus,50% 50%))}}
@media(max-height:560px) and (min-width:701px){#experience{min-height:450px}.topbar{padding-top:14px}.poster{padding-top:65px;padding-bottom:65px}.poster h1{font-size:35px;line-height:1.4}.poster .lead{margin-bottom:14px}.poster .eyebrow,.poster .with{margin-bottom:10px}.poster .note{margin-top:10px}.caption{bottom:120px}.caption h2{font-size:34px;margin-bottom:8px}.center .caption,.title-scene .caption{bottom:25%}.center .caption h2{font-size:42px}.title-scene .caption h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){.scene{transition:none}.scene img{will-change:auto}}.reduced .scene{transition:none}.reduced .scene img{will-change:auto}
</style>
</head>
<body>
<main id="experience" class="initial" aria-label="異世界転移録 オープニング">
<header class="topbar"><span class="brand">異世界転移録 <span aria-hidden="true">/</span> WORLD 01</span><a href="reader.html#scene-1-2">序章へスキップ →</a></header>
<div id="stage" class="stage" aria-label="オープニングの場面"></div>
<section id="poster" class="poster" aria-labelledby="openingTitle">
<p class="eyebrow">A CLASS OF THIRTY-TWO · A TEACHER · ANOTHER WORLD</p>
<h1 id="openingTitle">ゲーム知識で<br>異世界転生してみた</h1>
<p class="with">with Codex</p>
<p class="lead">先生一人、生徒三十二人。期限は百日。<br>知っているはずの世界で、知らない旅が始まる。</p>
<div class="actions"><button id="start" class="primary">オープニングを再生 <span aria-hidden="true">▶</span></button><a class="secondary" href="reader.html#scene-1-2">すぐに物語を読む →</a></div>
<p class="note">約1分・音声なし ／ 結末のネタバレはありません</p>
</section>
<div id="controls" class="controls" aria-label="再生コントロール" hidden>
<label class="visually-hidden" for="progress">再生位置（秒）</label><input type="range" id="progress" min="0" max="58" step="0.1" value="0" aria-valuetext="0秒 / 58秒">
<div class="control-row"><button id="play" aria-label="一時停止">一時停止 Ⅱ</button><button id="restart" aria-label="最初から再生">↺</button><span id="time" class="time">0:00 / 0:58</span><nav id="chapters" class="chapter-dots" aria-label="場面を選ぶ"></nav><span class="spacer"></span><label id="motionLabel"><input id="motion" type="checkbox">動きを控える</label><button id="fullscreen">全画面 ↗</button></div>
</div>
<p id="status" role="status" hidden></p>
<p id="announcement" class="visually-hidden" aria-live="polite"></p>
<noscript>オープニングの再生にはJavaScriptが必要です。<a href="reader.html#scene-1-2">序章から物語を読む →</a></noscript>
</main>
<script>
(() => {
  'use strict';
  const classroom = `<div class="classroom" aria-hidden="true"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="windowLight" x2="0" y2="1"><stop stop-color="#aebeba"/><stop offset="1" stop-color="#596c70"/></linearGradient><pattern id="floor" width="170" height="90" patternUnits="userSpaceOnUse"><path d="M0 90H170V0" fill="none" stroke="#7a8478" stroke-opacity=".12"/></pattern><g id="desk"><path d="M0 0h150l18 28H-18z" fill="#596565" stroke="#8d9685" stroke-opacity=".5"/><path d="M-8 27v95m166-95v95" stroke="#243239" stroke-width="8"/><path d="M24 67h102v43H24z" fill="#28393e"/><path d="M33 111v46m85-46v46" stroke="#26343c" stroke-width="7"/></g></defs><path d="M0 0h1600v560H0z" fill="#263a40"/><path d="M0 560h1600v340H0z" fill="#26353d"/><path d="M0 560h1600v340H0z" fill="url(#floor)"/><path d="M90 70h405v440H90z" fill="url(#windowLight)"/><path d="M100 80h385v420H100zM228 80v420M357 80v420M100 290h385" fill="none" stroke="#344850" stroke-width="12"/><path d="M515 145h820v290H515z" fill="#182f31" stroke="#61716a" stroke-width="12"/><path d="M523 441h805" stroke="#9d9c86" stroke-width="7"/><text x="605" y="250" fill="#d1d7be" font-size="33" font-family="serif" letter-spacing="8" opacity=".7">2年3組</text><path d="M90 510 450 900h765L495 510z" fill="#d9d7ab" opacity=".07"/><circle cx="1425" cy="180" r="45" fill="#93a09b" opacity=".5"/><path d="M1425 148v32l24 12" fill="none" stroke="#26383e" stroke-width="5"/><use href="#desk" x="410" y="560"/><use href="#desk" x="690" y="560"/><use href="#desk" x="970" y="560"/><use href="#desk" x="1250" y="560"/><g transform="translate(-170 -95) scale(1.3)"><use href="#desk" x="410" y="660"/><use href="#desk" x="690" y="660"/><use href="#desk" x="970" y="660"/><use href="#desk" x="1250" y="660"/></g></svg></div>`;
  const scenes = [
    {duration:6,name:'いつもの教室',type:'center',art:classroom,kicker:'BEFORE THE FIRST DAY',title:'いつもと同じ、<br>一日が続くはずだった。',text:'あの教室の、その先に。'},
    {duration:7,name:'境界の女神',image:'assets/lyucia-turn-1-2.webp',alt:'光の門の前に現れた境界の女神リュシアと、彼女を見上げる生徒たち',focus:'50% 0%',mobile:'51% 32%',kicker:'THE GODDESS AT THE BOUNDARY',title:'帰り道は、<br>まだ見えない。',text:'境界の女神リュシアとの出会い。'},
    {duration:7,name:'三十三人',image:'assets/reader/prologue-1-5-v2.webp',alt:'未知の土地で集まった制服姿の生徒たちと先生',focus:'50% 44%',mobile:'64% 45%',kicker:'ONE TEACHER · THIRTY-TWO STUDENTS',title:'先生一人。<br>生徒三十二人。',text:'連れて帰りたい顔には、みんな名前がある。'},
    {duration:8,name:'百日の期限',type:'center',image:'assets/elden-limgrave-turn-1-4.webp',alt:'狭間の地の草原と黄金樹を見渡す生徒たち',focus:'50% 40%',kicker:'WORLD 01 / ELDEN RING',title:'期限は、百日。',text:'ここは、画面の向こうにあった世界。'},
    {duration:7,name:'赤い月',type:'red',image:'assets/red-moon-vigil-turn-1-38.webp',alt:'赤い月の下、教会で身を寄せ合う先生と生徒たち',focus:'50% 28%',mobile:'51% 28%',kicker:'WHEN THE RED MOON RISES',title:'知っている攻略が、<br>通じない夜もある。',text:'赤い月が、いつもの法則を変えていく。'},
    {duration:8,name:'生きるために',image:'assets/camp-turn-1-11.webp',alt:'廃教会で記録を取り、石を積み、拠点を整える生徒たち',focus:'50% 55%',mobile:'62% 50%',kicker:'BUILD · EXPLORE · STAND TOGETHER',title:'戦う。探す。<br>明日の居場所をつくる。',text:'剣を持つ手も、水を運ぶ手も、この旅を進める。'},
    {duration:7,name:'先生の決意',image:'assets/teacher-turn-1-8.webp',alt:'攻略情報を見ながら次の行動を考える先生と生徒たち',focus:'50% 38%',mobile:'49% 35%',kicker:'KNOWLEDGE IS ONLY THE BEGINNING',title:'知識を、選択に。<br>選択を、帰り道に。',text:'正解の見えない世界で、先生は次の一手を考える。'},
    {duration:8,name:'旅のはじまり',type:'center title-scene',image:'assets/elden-limgrave-turn-1-4.webp',alt:'黄金樹が輝く草原へ踏み出す生徒たち',focus:'50% 42%',kicker:'第一章 ── エルデンリング編',title:'ゲーム知識で<br>異世界転生してみた',text:'with Codex',end:true}
  ];
  const $ = id => document.getElementById(id);
  const root=$('experience'), stage=$('stage'), progress=$('progress'), play=$('play');
  let total=0,elapsed=0,current=-1,playing=false,started=false,last=0,frame=0;
  const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
  $('motion').checked=motionQuery.matches;
  const applyMotion=()=>root.classList.toggle('reduced',$('motion').checked);
  applyMotion();$('motion').addEventListener('change',()=>{applyMotion();render();});
  scenes.forEach((scene,i)=>{
    scene.start=total;total+=scene.duration;
    const section=document.createElement('section');
    section.className=`scene ${scene.type||''}`;section.setAttribute('aria-hidden','true');section.inert=true;
    section.style.setProperty('--focus',scene.focus||'50% 50%');section.style.setProperty('--mobile-focus',scene.mobile||scene.focus||'50% 50%');
    section.innerHTML=(scene.art||`<img src="${scene.image}" alt="${scene.alt}" decoding="async">`)+`<div class="shade"></div><div class="caption"><span class="eyebrow">${scene.kicker}</span><h2>${scene.title}</h2><p>${scene.text}</p>${scene.end?'<div class="actions end-actions"><a class="primary" href="reader.html#scene-1-2">物語をはじめる <span aria-hidden="true">→</span></a><button id="replay" class="secondary">もう一度見る</button></div><p class="final-note">人間の選択と、Codexの進行で紡いだ冒険。</p>':''}</div>`;
    stage.append(section);scene.element=section;scene.img=section.querySelector('img');
    const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',`${i+1}. ${scene.name}`);button.title=scene.name;button.setAttribute('aria-current','false');button.addEventListener('click',()=>{elapsed=scene.start;if(!started)begin();render();});$('chapters').append(button);scene.button=button;
  });
  progress.max=total;
  const clock=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;
  function render(){
    const index=scenes.findIndex(s=>elapsed<s.start+s.duration);
    const next=index<0?scenes.length-1:index;
    if(next!==current){
      const focused=document.activeElement;
      if(current>=0&&scenes[current].element.contains(focused))play.focus();
      scenes.forEach((scene,i)=>{const active=i===next;scene.element.classList.toggle('current',active);scene.element.setAttribute('aria-hidden',String(!active));scene.element.inert=!active;scene.button.setAttribute('aria-current',String(active));});
      current=next;$('announcement').textContent=scenes[next].name;
    }
    const scene=scenes[current];
    const p=Math.min(1,Math.max(0,(elapsed-scene.start)/scene.duration));
    if(scene.img)scene.img.style.transform=$('motion').checked?'none':`scale(${1.025+p*.045}) translateY(${-p*.7}%)`;
    progress.value=elapsed;progress.setAttribute('aria-valuetext',`${Math.floor(elapsed)}秒 / ${total}秒`);
    $('time').textContent=`${clock(elapsed)} / ${clock(total)}`;
    play.textContent=playing?'一時停止 Ⅱ':elapsed>=total?'再生 ↻':'再生 ▶';
    play.setAttribute('aria-label',playing?'一時停止':elapsed>=total?'もう一度再生':'再生');
  }
  function tick(now){
    if(!playing)return;
    elapsed=Math.min(total,elapsed+(now-last)/1000);last=now;
    if(elapsed>=total)playing=false;
    render();if(playing)frame=requestAnimationFrame(tick);
  }
  function setPlaying(value){cancelAnimationFrame(frame);playing=value;last=performance.now();render();if(playing)frame=requestAnimationFrame(tick);}
  function begin(){started=true;root.classList.remove('initial');$('poster').hidden=true;$('controls').hidden=false;setPlaying(true);play.focus();}
  function restart(){elapsed=0;if(!started)begin();else setPlaying(true);}
  $('start').addEventListener('click',begin);$('restart').addEventListener('click',restart);$('replay').addEventListener('click',restart);
  play.addEventListener('click',()=>{if(elapsed>=total)elapsed=0;setPlaying(!playing);});
  progress.addEventListener('input',()=>{elapsed=Number(progress.value);last=performance.now();if(elapsed>=total)setPlaying(false);else render();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlaying(false);});
  document.addEventListener('keydown',event=>{
    if(!started||/INPUT|SELECT|BUTTON|A|TEXTAREA/.test(event.target.tagName))return;
    if(event.code==='Space'){event.preventDefault();play.click();}
    if(event.code==='ArrowRight'||event.code==='ArrowLeft'){event.preventDefault();elapsed=Math.max(0,Math.min(total,elapsed+(event.code==='ArrowRight'?5:-5)));last=performance.now();if(elapsed>=total)setPlaying(false);else render();}
  });
  const full=$('fullscreen');
  if(!root.requestFullscreen)full.hidden=true;
  full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await root.requestFullscreen();}catch{$('status').textContent='このブラウザーでは全画面に切り替えられません。通常表示で再生できます。';$('status').hidden=false;}});
  document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'全画面を閉じる':'全画面 ↗';});
})();
</script>
</body>
</html>
