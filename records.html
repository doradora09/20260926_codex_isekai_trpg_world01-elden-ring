<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>各ターンの状態・判定記録｜第1世界</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101b23;color:#e8e7df;line-height:1.75}*{box-sizing:border-box}body{margin:0}a{color:#e7c783}header,main{max-width:1160px;margin:auto;padding:22px}header{display:flex;gap:20px;justify-content:space-between;border-bottom:1px solid #34414a}h1{font-size:clamp(24px,4vw,36px);margin:12px 0}h2{font-size:24px;line-height:1.5}p{overflow-wrap:anywhere}.muted{color:#afbac2;font-size:14px}.eyebrow{color:#dfbd77;letter-spacing:.12em;font-size:12px}.filters{display:grid;grid-template-columns:1fr 190px;gap:16px;margin:24px 0}.filters label{display:grid;gap:6px;font-size:14px}.wide{grid-column:1/-1}input,select,button{font:inherit;color:inherit;background:#1b2c37;border:1px solid #4a5b66;border-radius:8px;padding:10px;max-width:100%}input,select{width:100%;min-width:0}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){border-color:#dfbd77}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #e7c783;outline-offset:3px}.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0}.panel{background:#152630;border:1px solid #344751;border-radius:14px;padding:clamp(16px,4vw,32px);margin:20px 0}.record-file{font-family:ui-monospace,monospace;overflow-wrap:anywhere;font-size:12px;color:#aabac4}.prose{font-family:serif;line-height:2}.prose p{white-space:pre-wrap}.record-tree details{border-left:2px solid #3d505b;margin:12px 0;padding-left:14px}.record-tree summary{cursor:pointer;overflow-wrap:anywhere}.record-tree dl{margin:8px 0}.record-tree dt{color:#dfbd77;margin-top:10px;font-size:14px;overflow-wrap:anywhere}.record-tree dd{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}.record-tree ol{padding-left:24px}.record-tree li{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.count{color:#9fb0bb;font-size:12px;margin-left:9px}.raw{margin-top:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto;background:#0c171e;padding:16px;font-size:13px;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.error{color:#ffb5a8}footer{max-width:1160px;margin:20px auto 40px;padding:0 22px}[hidden]{display:none!important}@media(max-width:600px){header{font-size:14px;flex-wrap:wrap}.filters{grid-template-columns:1fr}.pager{gap:8px;font-size:14px}.panel{padding:16px}}
</style>
<script src="records-data.js" defer></script>
</head>
<body>
<header><a href="reader.html">← 物語を読む</a><span>第1世界 · エルデンリング編</span><a href="index.html">本編トップ</a></header>
<main>
<span class="eyebrow">ARCHIVE / WORLD 01</span><h1>各ターンの状態・判定記録</h1>
<p class="muted">当時の状態と、判定前の条件・実際の出目を残した記録です。後の展開や結末を含みます。</p>
<p id="status" role="status" aria-live="polite">記録を読み込んでいます…</p>
<button id="retry" hidden type="button">読み込みをやり直す</button>
<section id="controls" hidden aria-label="記録を探す">
<div class="filters"><label>ターン・タイトルを探す<input id="search" type="search" placeholder="例：106、ゴドリック、女神"></label><label>記録の種類<select id="kind"><option value="all">すべて</option><option value="state">各ターンの状態</option><option value="conditions">判定条件</option><option value="dice">出目</option><option value="other">その他の記録</option></select></label><label class="wide">表示する記録<select id="recordSelect"></select></label></div>
<div class="pager"><button id="prev" type="button">← 前の記録</button><span id="resultCount" class="muted"></span><button id="next" type="button">次の記録 →</button></div>
</section>
<article id="record" class="panel" hidden tabindex="-1"><p id="recordFile" class="record-file"></p><h2 id="recordTitle"></h2><div class="actions"><a id="storyLink" hidden>この話を読む ↗</a><button id="download" type="button">この記録をJSONで保存</button></div><div id="prose" class="prose"></div><div id="tree" class="record-tree"></div><details id="rawDetails" class="raw"><summary>元のJSONを表示する</summary><pre id="raw"></pre></details></article>
<noscript><p>記録の表示にはJavaScriptが必要です。<a href="reader.html">物語に戻る</a></p></noscript>
</main><footer class="muted">制作時の234件を一つのデータファイルにまとめています。記録画面を開いたときだけ読み込み、記録を選んでも物語の状態は変わりません。</footer>
<script>
(function(){'use strict';
const labels={id:'ID',title:'題名',scene:'場面',day:'日付',worldTime:'作中日時',text:'本文',quote:'台詞',cards:'当時の選択肢',rules:'ルール',teacher:'先生',students:'生徒',party:'参加者',checks:'判定',dice:'出目',roll:'出目',modifier:'修正値',total:'合計',points:'獲得点',conditions:'判定条件',thresholds:'判定基準',outcomes:'結果',victory:'勝利',deaths:'死者',death:'死亡',injuries:'負傷',resources:'資源',inventory:'所持品',equipment:'装備',status:'状態',source:'出典',sources:'参照元',method:'判定方法',rolledAt:'判定日時',conditionsSha256:'元の条件ファイルのSHA-256',conditionsSHA256:'元の条件ファイルのSHA-256',note:'補足',notes:'補足',summary:'概要',result:'結果',reason:'理由',count:'数量',name:'名前',label:'判定名',before:'実行前',after:'実行後',cost:'消費',reward:'獲得',success:'成功',failure:'失敗',progress:'進捗',intent:'方針'};
const kindLabels={state:'状態',conditions:'判定条件',dice:'出目',other:'その他'};
function describe(key,data){const m=key.match(/turn-1-(\d+)/),turn=m?Number(m[1]):null;const kind=/turn-1-\d+\.json$/.test(key)?'state':/conditions\.json$/.test(key)?'conditions':/dice\.json$/.test(key)?'dice':'other';const title=typeof data?.title==='string'?data.title:key.split('/').pop().replace(/\.json$/,'');return{key,turn,kind,title,label:(turn?'TURN 1-'+turn+' · ':'')+kindLabels[kind]+'｜'+title}}
async function decodePack(pack){if(!pack||pack.encoding!=='gzip-base64')throw Error('記録データが見つかりません。再読み込みしてください。');if(typeof DecompressionStream==='undefined')throw Error('このブラウザーでは記録を展開できません。最新版のChrome・Edge・Safari・Firefoxで開いてください。');const bytes=Uint8Array.from(atob(pack.data),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const obj=JSON.parse(await new Response(stream).text());if(obj.version!==1||Object.keys(obj.records||{}).length!==pack.recordCount)throw Error('記録データを確認できませんでした。');return obj.records}
function hashKey(hash){try{return decodeURIComponent(hash.replace(/^#/,''))}catch{return null}}
window.RecordArchive={describe,decodePack,hashKey};
document.addEventListener('DOMContentLoaded',async()=>{
const $=id=>document.getElementById(id),el=(tag,text)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;return n};let records,entries=[],filtered=[],currentKey=null;
$('retry').onclick=()=>location.reload();
try{records=await decodePack(window.ISEKAI_RECORDS_PACK);window.ISEKAI_RECORDS_PACK=null;entries=Object.entries(records).map(([k,v])=>describe(k,v)).sort((a,b)=>(a.turn??1e9)-(b.turn??1e9)||a.key.localeCompare(b.key));$('status').textContent=entries.length+'件の記録を読み込みました。';$('controls').hidden=false}catch(e){$('status').textContent=e.message;$('status').className='error';$('retry').hidden=false;return}
function recordKey(value){if(typeof value!=='string'||!value.endsWith('.json'))return null;const cleaned=value.replace(/^\.\//,'');if(Object.hasOwn(records,cleaned))return cleaned;const folder=currentKey.includes('/')?currentKey.slice(0,currentKey.lastIndexOf('/')+1):'';return Object.hasOwn(records,folder+cleaned)?folder+cleaned:null}
function primitive(parent,value){const text=value===null?'null':String(value),key=recordKey(value);if(key){const a=el('a',text);a.href='#'+encodeURI(key);parent.append(a)}else parent.append(el('span',text))}
function contents(parent,value){if(value===null||typeof value!=='object'){primitive(parent,value);return}if(Array.isArray(value)){if(!value.length){parent.append(el('p','（空の配列）'));return}const list=el('ol');for(const [i,item] of value.entries()){const row=el('li');if(item!==null&&typeof item==='object')branch(row,String(i+1),item);else primitive(row,item);list.append(row)}parent.append(list)}else{const fields=el('dl');for(const [key,item] of Object.entries(value)){if(item!==null&&typeof item==='object'){const dd=el('dd');branch(dd,labels[key]||key,item,key);fields.append(dd)}else{fields.append(el('dt',labels[key]||key));const dd=el('dd');primitive(dd,item);fields.append(dd)}}if(!Object.keys(value).length)fields.append(el('dd','（空のオブジェクト）'));parent.append(fields)}}
function branch(parent,label,value,rawKey){const details=el('details'),summary=el('summary',label);if(rawKey&&labels[rawKey])summary.title=rawKey;summary.append(el('span',Array.isArray(value)?value.length+'件':Object.keys(value).length+'項目'));summary.lastChild.className='count';details.append(summary);let built=false;details.addEventListener('toggle',()=>{if(details.open&&!built){built=true;contents(details,value)}});parent.append(details)}
function updatePager(){const i=filtered.findIndex(x=>x.key===currentKey);$('prev').disabled=i<=0;$('next').disabled=i<0||i>=filtered.length-1;$('resultCount').textContent=filtered.length+'件'+(i>=0?' ／ '+(i+1)+'件目':'');}
function filter(){const q=$('search').value.trim().toLocaleLowerCase(),kind=$('kind').value;filtered=entries.filter(e=>(kind==='all'||kind===e.kind)&&(!q||(e.label+' '+e.key).toLocaleLowerCase().includes(q)));$('recordSelect').replaceChildren();if(!filtered.length){const option=el('option','一致する記録がありません');option.value='';$('recordSelect').append(option);$('recordSelect').disabled=true}else{for(const e of filtered){const option=el('option',e.label);option.value=e.key;$('recordSelect').append(option)}$('recordSelect').disabled=false;$('recordSelect').value=filtered.some(e=>e.key===currentKey)?currentKey:''}updatePager()}
function showHash(){const requested=hashKey(location.hash),key=requested||(!location.hash?entries[0].key:null);if(!key||!Object.hasOwn(records,key)){$('record').hidden=true;$('status').textContent='指定された記録が見つかりません。上の一覧から選び直してください。';$('status').className='error';currentKey=null;filter();return}currentKey=key;const data=records[key],meta=describe(key,data);$('record').hidden=false;$('status').textContent=entries.length+'件の記録を読み込みました。';$('status').className='';$('recordFile').textContent=key;$('recordTitle').textContent=meta.label;$('storyLink').hidden=!meta.turn;if(meta.turn)$('storyLink').href='reader.html#scene-1-'+meta.turn;$('prose').replaceChildren();$('tree').replaceChildren();$('rawDetails').open=false;$('raw').textContent='';if(data&&typeof data==='object'&&!Array.isArray(data)){for(const [k,v] of Object.entries(data)){if(k==='text'&&Array.isArray(v)&&v.every(x=>typeof x==='string')){for(const line of v)$('prose').append(el('p',line))}else if(v!==null&&typeof v==='object')branch($('tree'),labels[k]||k,v,k);else{const dl=el('dl'),dt=el('dt',labels[k]||k),dd=el('dd');primitive(dd,v);dl.append(dt,dd);$('tree').append(dl)}}}else contents($('tree'),data);filter()}
$('recordSelect').onchange=e=>{if(e.target.value)location.hash=encodeURI(e.target.value)};$('search').oninput=filter;$('kind').onchange=filter;$('prev').onclick=()=>{const i=filtered.findIndex(e=>e.key===currentKey);if(i>0)location.hash=encodeURI(filtered[i-1].key)};$('next').onclick=()=>{const i=filtered.findIndex(e=>e.key===currentKey);if(i>=0&&i<filtered.length-1)location.hash=encodeURI(filtered[i+1].key)};
$('rawDetails').addEventListener('toggle',()=>{if($('rawDetails').open&&currentKey&&!$('raw').textContent)$('raw').textContent=JSON.stringify(records[currentKey],null,2)});
$('download').onclick=()=>{if(!currentKey)return;const url=URL.createObjectURL(new Blob([JSON.stringify(records[currentKey],null,2)],{type:'application/json;charset=utf-8'})),a=el('a');a.href=url;a.download=currentKey.split('/').pop();document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('hashchange',showHash);showHash();
});
})();
</script></body></html>
