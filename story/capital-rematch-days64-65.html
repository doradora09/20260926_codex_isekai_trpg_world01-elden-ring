<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>備え直し、門を開く</title><style>body{background:#101a23;color:#ece6db;font:17px/1.8 system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}a{color:#e9c987}img{width:100%;border-radius:8px}article{border-top:1px solid #56616a;padding:20px 0}</style><main><a href="../index.html">最新の本編</a> · <a href="../world-map.html">更新地図</a> · <a href="capital-approach-days60-63.html">前の4話</a><h1>備え直し、門を開く</h1><p>DAY64準備からDAY65再戦。門番は討伐済み、王都街区は未踏です。</p><article><h2><a href="academy-day64.html">DAY64 もう一度、前に立つために。</a></h2><p>DAY64。主力は教会へ帰還し、装備補修と矢を補給。A隊が林脇の洞窟を無傷攻略して炎竜印を回収。軍馬は手入れ・引き歩きの段階へ。</p><img src="../assets/sentinel-preparation-turn-1-74.webp" alt=""></article><article><h2><a href="academy-day65.html">DAY65 雷を越えて、王都の門へ。</a></h2><p>DAY65。高原で雷防護を習得し再挑戦。判定14・13・13で竜のツリーガードを撃破。クララも終了まで存続、主力13人全員無傷。</p><img src="../assets/draconic-victory-turn-1-75.webp" alt=""></article></main></html>
