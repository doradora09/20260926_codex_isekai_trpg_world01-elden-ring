<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img">
<title>DAY63・竜のツリーガード初挑戦から帰還した十三人</title>
<rect width="900" height="1040" rx="12" fill="#e7ddbd"/>
<rect x="25" y="25" width="850" height="990" rx="8" fill="none" stroke="#a59670" stroke-width="2"/>
<g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" fill="#353b34">
<text x="65" y="86" font-size="25" letter-spacing="4" fill="#7c6b46">戦力の確認 ／ DAY 63</text>
<text x="65" y="148" font-size="40" font-weight="700">十三人で帰った。その次へ。</text>
<path d="M65 180H835" stroke="#9e8b62"/>
<rect x="65" y="213" width="770" height="94" rx="8" fill="#d9c394"/>
<text x="90" y="254" font-size="29" font-weight="700">生存 13人　／　門番は健在</text>
<text x="90" y="288" font-size="23">帰還先：外廓の戦場跡の祝福</text>
<rect x="65" y="334" width="770" height="198" rx="8" fill="#f3eedc" stroke="#b4a17a"/>
<path d="M101 371L137 386V432L119 450L101 432Z" fill="#7f8c83" stroke="#536257" stroke-width="3"/>
<text x="164" y="386" font-size="30" font-weight="700">先生　Lv50</text>
<text x="164" y="429" font-size="25">生命 36　／　持久 25</text>
<text x="90" y="473" font-size="25">片手剣 ＋2・ヒーターシールド</text>
<text x="90" y="508" font-size="25">騎士の防具 ／ 被弾して赤瓶を使用</text>
<rect x="65" y="554" width="770" height="192" rx="8" fill="#f3eedc" stroke="#b4a17a"/>
<text x="90" y="598" font-size="30" font-weight="700">大地 Lv37　／　前を支える仲間</text>
<text x="90" y="640" font-size="25">黄金のハルバード ＋1</text>
<text x="90" y="681" font-size="25">直人・陸・拓海 Lv27　／　ほか8人 Lv26</text>
<text x="90" y="720" font-size="24">陽太も被弾。クララは戦闘中に消失。</text>
<path d="M65 777H835" stroke="#9e8b62"/>
<text x="65" y="822" font-size="29" font-weight="700" fill="#805546">強さだけで、受け続けられない。</text>
<text x="65" y="869" font-size="25">炎と雷への備え ／ 装備の補修 ／ 交代の位置</text>
<text x="65" y="910" font-size="25">負けた瞬間から、次の作戦を組み直す。</text>
<text x="65" y="978" font-size="21" fill="#78705a">帰還時点の記録。翌日以降の強化は含めない。</text>
</g></svg>
