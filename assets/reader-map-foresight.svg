<rect x="4" y="4" width="1032" height="872" rx="15" fill="#e1d2ac"/><rect x="4" y="4" width="1032" height="872" rx="15" fill="url(#paper)"/><path d="M26 23l-3 833 990 2 2-835Z" fill="none" stroke="#756448" stroke-width="2"/>
