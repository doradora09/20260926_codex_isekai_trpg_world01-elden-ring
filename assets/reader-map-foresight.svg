<use href="#church" x="304" y="648"/><text x="244" y="716" font-size="25">エレの教会</text><text x="244" y="745" font-size="19">帰る場所・全員の拠点</text>
<text x="858" y="722" font-size="23">アギール湖</text><text x="828" y="754" font-size="17">岸と水面は別に確かめる</text>
<path d="M325 611Q343 537 446 491T488 365" fill="none" stroke="#4d695d" stroke-width="5"/><circle cx="490" cy="349" r="12" fill="#9b803d"/><path d="M474 350q18-45 30-35" fill="none" stroke="#b39749" stroke-width="3"/><text x="515" y="356" font-size="25">関門前の祝福</text><text x="515" y="384" font-size="18">ここまでの足場は、得た</text><path d="M490 322Q465 274 540 231T594 179" fill="none" stroke="#947142" stroke-width="4" stroke-dasharray="8 10"/><path d="M550 174v-31h-9v-17h17v11h18v-11h17v11h18v-11h17v17h-9v31Z" fill="#ad956b66" stroke="#675a45" stroke-width="2"/><text x="662" y="162" font-size="24">ストームヴィル城</text><text x="658" y="196" font-size="18">先読みで知る、その先</text><text x="252" y="258" font-size="22">嵐の丘</text><path d="M263 227l28-27 16 13 19-33 27 28" fill="none" stroke="#8d805e" stroke-width="2"/><rect x="532" y="438" width="234" height="142" rx="7" fill="#f2e5c5bb" stroke="#98835a" stroke-dasharray="5 5"/><text x="548" y="471" font-size="22">野営地の確認</text><text x="548" y="507" font-size="19">角笛の兵は、どこへ？</text><text x="548" y="539" font-size="19">一体ずつ離せるか？</text><path d="M362 652Q594 738 791 631" fill="none" stroke="#5e7b6d" stroke-width="3"/><text x="504" y="706" font-size="19">水と食料を支える生活圏</text>
<path d="M94 184v72m-15-46 15-26 15 26" fill="none" stroke="#6f6654" stroke-width="2"/><text x="85" y="171" font-size="20">北</text>
<path d="M66 786h903" stroke="#8d7c59"/><text x="68" y="821" font-size="18">太線＝既知の生活圏　／　金の点線＝先読みの道筋　／　敵の位置は今日また確かめる</text><text x="68" y="848" font-size="16" fill="#7b7058">読者用の略図。位置と縮尺は概略で、その時点の知識だけを記載。</text></g></svg>