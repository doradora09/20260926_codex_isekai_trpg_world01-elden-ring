<text x="155" y="275" font-size="35" font-weight="700">エレの教会</text>
<text x="155" y="321" font-size="26" fill="#626550">現在地・三十三人が生存</text>
<path d="M111 351V382" fill="none" stroke="#6c785d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="66" y="394" width="767" height="133" rx="9" fill="#f2edda" stroke="#8f8967" stroke-width="2"/>
