<text x="155" y="497" font-size="26" fill="#626550">十三人が登録した道へ</text>
<path d="M111 527V558" fill="none" stroke="#6c785d" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
<rect x="66" y="570" width="767" height="133" rx="9" fill="#f2edda" stroke="#8f8967" stroke-width="2"/>
