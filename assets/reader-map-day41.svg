<title>赤月の翌朝、城へ戻る</title>
<defs><pattern id="paper" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 21H22" stroke="#9e8453" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6c785d" stroke-width="1.5"/></marker></defs>
<rect width="900" height="1040" rx="12" fill="#e7ddbd"/><rect x="25" y="25" width="850" height="990" rx="8" fill="url(#paper)" stroke="#a59670" stroke-width="2"/>
<g font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif" fill="#353b34">
<text x="68" y="88" font-size="25" letter-spacing="5" fill="#7c6b46">旅の略図 ／ DAY 41</text>
<text x="68" y="153" font-size="39" font-weight="700">赤月の翌朝、城へ戻る</text>
<path d="M70 181H830" stroke="#9e8b62"/>
<rect x="66" y="218" width="767" height="133" rx="9" fill="#d4ba7a" stroke="#8f8967" stroke-width="2"/>
