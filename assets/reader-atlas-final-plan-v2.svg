<path d="M17 16L981 12 987 984 12 987Z" fill="url(#paper)" stroke="#82704c" stroke-width="3"/><path d="M17 16L981 12 987 984 12 987Z" fill="url(#grain)"/><path d="M37 40L964 34 959 961 35 966Z" fill="none" stroke="#8b7852" stroke-width="1.4"/><path d="M503 35q-13 309 0 929" fill="none" stroke="#9d895e" stroke-width="1" opacity=".3"/>
<g font-family="Hiragino Mincho ProN,Yu Mincho,serif" fill="#66553d"><text x="73" y="74" font-size="20" letter-spacing="4" fill="#8b7143">旅の手帳 ／ DAY 97・朝</text><text x="72" y="126" font-size="35">黄金樹へ。そして、帰る。</text><path d="M73 145q306 5 672-2" stroke="#a28b5b" fill="none"/>
<g transform="translate(902 202)" stroke="#817450" stroke-width="1.8" fill="none"><path d="M0-20V29M-10-2 0-20 10-2M-20 5H20"/><circle cy="5" r="13"/></g><text x="895" y="170" font-size="17">北</text>
<g transform="translate(749 304) scale(1.65)" stroke="#a88943" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-10 55Q8 7 1-45M9 52Q20 8 2-44M1-9Q-45-8-56-44M2-23Q35-30 53-65M-12-10Q-26-48-20-67M20-19Q46-6 68-23M-23-19l-26 7M-27-43l-19-13M24-35l4-25M-1-36l15-29"/><ellipse cy="-25" rx="80" ry="64" fill="#bc9945" fill-opacity=".08" stroke-width="1" stroke-dasharray="2 8"/></g><use href="#castle" transform="translate(660 518) scale(1.4)" filter="url(#ink-waver)"/><text x="568" y="583" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 568 583)">灰都・女王の閨</text><text x="568" y="613" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 568 613)">十三人が登録した出発点</text><text x="75" y="228" font-size="25" fill="#925846" text-anchor="start" transform="rotate(-2 75 228)">最後の二連戦</text><text x="75" y="258" font-size="18" fill="#925846" text-anchor="start" transform="rotate(-2 75 258)">ラダゴン → エルデの獣</text><text x="78" y="302" font-size="20" fill="#66553d" text-anchor="start">回復と支援を、後半にも残す。</text><use href="#church" transform="translate(262 755) scale(1.3)" filter="url(#ink-waver)"/><circle cx="319" cy="757" r="23" fill="#e4d3a1" stroke="#925846" stroke-width="2"/><circle cx="319" cy="757" r="6" fill="#925846"/><path d="M293 760q-8-31 30-31" fill="none" stroke="#925846" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="100" y="827" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 100 827)">エレの教会</text><text x="100" y="857" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 100 857)">留守と救援を、二十人で</text><use href="#grace" transform="translate(201 541) scale(1.2)" filter="url(#ink-waver)"/><text x="77" y="435" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 77 435)">予備の祝福</text><text x="77" y="465" font-size="18" fill="#9b742f" text-anchor="start" transform="rotate(-2 77 465)">翌朝六時、未帰還なら開く</text><path d="M328 724Q458 579 621 529" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M328 724Q458 579 621 529" fill="none" stroke="#9b742f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><text x="376" y="666" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 376 666)">先生＋十二人</text><text x="376" y="696" font-size="18" fill="#9b742f" text-anchor="start" transform="rotate(-2 376 696)">登録した祝福へ</text><path d="M273 709Q292 624 224 576" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M273 709Q292 624 224 576" fill="none" stroke="#536b52" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><path d="M688 478Q718 430 745 373" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M688 478Q718 430 745 373" fill="none" stroke="#925846" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><use href="#tree" transform="translate(98 664) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(136 683) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(471 766) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(508 790) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(544 779) scale(0.75)" filter="url(#ink-waver)"/><text x="561" y="862" font-size="23" fill="#536b52" text-anchor="start" transform="rotate(-3 561 862)">帰り道も、作戦に入れておく。</text>
<path d="M72 902q394 5 853-2" fill="none" stroke="#9b8455"/><text x="72" y="934" font-size="19">金の点線：祝福で移動　　赤の点線：決戦へ　　緑の点線：未帰還時の救援</text><text x="72" y="964" font-size="16" fill="#7d7258">地形と位置は概略。その時点の記録で描いた作戦用の略図です。</text></g></svg>