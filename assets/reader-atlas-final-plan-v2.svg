 <g id="tower" fill="#d5c095" stroke="#66553d" stroke-width="2.3"><path d="M-15 22v-47h-5v-12h9v6H0v-6h10v6h10v12h-5v47Z"/><path d="M-3-21h6v9h-6M-4 22V7h8v15"/></g>
