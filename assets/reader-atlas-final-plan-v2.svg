<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">黄金樹へ。そして、帰る。</title><desc id="desc">主力十三人は登録済みの灰都から黄金樹へ。教会の二十人は留守と救援を担当。翌朝六時に未帰還なら新しい祝福を開く。</desc><defs>
 <radialGradient id="paper"><stop stop-color="#ebdfbd"/><stop offset=".7" stop-color="#decea5"/><stop offset="1" stop-color="#bba77b"/></radialGradient>
