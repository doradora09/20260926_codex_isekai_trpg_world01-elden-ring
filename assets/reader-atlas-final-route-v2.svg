<path d="M671 763l110 30 95-43-34-13-121-7Z" fill="#b6af98" stroke="#66553d" stroke-width="2" opacity="1"/><path d="M676 769l22 44 29-32m72 7 21 39 27-70" fill="none" stroke="#807b69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><use href="#castle" transform="translate(766 715) scale(1.15)" filter="url(#ink-waver)"/><path d="M656 561l45 8-18 33Z" fill="#bbb4a0" stroke="#8d826a" stroke-width="2" opacity="0.7"/><path d="M820 535l45 8-18 33Z" fill="#bbb4a0" stroke="#8d826a" stroke-width="2" opacity="0.7"/><path d="M873 680l45 8-18 33Z" fill="#bbb4a0" stroke="#8d826a" stroke-width="2" opacity="0.7"/><path d="M742 590c-95-80 148-117 130-34s-146 20-78-36 137 6 72 41" fill="none" stroke="#8c8d81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><text x="643" y="802" font-size="25" fill="#925846" text-anchor="start" transform="rotate(-2 643 802)">① マリケス</text><text x="643" y="832" font-size="18" fill="#925846" text-anchor="start" transform="rotate(-2 643 832)">まずは、再戦から</text><use href="#church" transform="translate(161 738) scale(1)" filter="url(#ink-waver)"/><circle cx="207" cy="732" r="23" fill="#e4d3a1" stroke="#925846" stroke-width="2"/><circle cx="207" cy="732" r="6" fill="#925846"/><path d="M181 735q-8-31 30-31" fill="none" stroke="#925846" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="78" y="804" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 78 804)">今夜は、教会</text><text x="78" y="834" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 78 834)">赤月を越えて出発する</text><use href="#castle" transform="translate(378 493) scale(1.4)" filter="url(#ink-waver)"/><g transform="translate(533 271) scale(1.3)" stroke="#a88943" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-10 55Q8 7 1-45M9 52Q20 8 2-44M1-9Q-45-8-56-44M2-23Q35-30 53-65M-12-10Q-26-48-20-67M20-19Q46-6 68-23M-23-19l-26 7M-27-43l-19-13M24-35l4-25M-1-36l15-29"/><ellipse cy="-25" rx="80" ry="64" fill="#bc9945" fill-opacity=".08" stroke-width="1" stroke-dasharray="2 8"/></g><path d="M257 422Q389 371 474 459L509 586 291 616Z" fill="url(#hatch)" stroke="#8c8063" stroke-width="2" opacity="0.6"/><text x="93" y="415" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 93 415)">② 灰都・大聖堂</text><text x="93" y="445" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 93 445)">百智卿ギデオン</text><text x="402" y="580" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 402 580)">③ 王座の前</text><text x="402" y="610" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 402 610)">ゴッドフレイ／ホーラ・ルー</text><text x="619" y="270" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 619 270)">④ 黄金樹の内側</text><text x="619" y="300" font-size="18" fill="#9b742f" text-anchor="start" transform="rotate(-2 619 300)">ラダゴンと、エルデの獣</text><text x="618" y="335" font-size="20" fill="#925846" text-anchor="start">ここだけは、休めない二連戦。</text><path d="M715 677Q619 579 455 529" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M715 677Q619 579 455 529" fill="none" stroke="#9b742f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><path d="M376 464Q402 386 509 334" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M376 464Q402 386 509 334" fill="none" stroke="#9b742f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><text x="165" y="274" font-size="27" fill="#5d7f88" text-anchor="start" transform="rotate(-6 165 274)">灰に変わる王都</text><text x="94" y="311" font-size="18" fill="#66553d" text-anchor="start">先読みで知る、まだ歩いていない先</text><text x="283" y="866" font-size="23" fill="#925846" text-anchor="start">DAY91–99：攻略と立て直しに使える九日</text>
<path d="M72 902q394 5 853-2" fill="none" stroke="#9b8455"/><text x="72" y="934" font-size="19">金の点線：先読みで確かめた道筋。四つの関門は、まだ勝利の印ではない。</text><text x="72" y="964" font-size="16" fill="#7d7258">地形と位置は概略。その時点の記録で描いた作戦用の略図です。</text></g></svg>