<g font-family="Hiragino Mincho ProN,Yu Mincho,serif" fill="#66553d"><text x="73" y="74" font-size="20" letter-spacing="4" fill="#8b7143">旅の手帳 ／ DAY 89・夜</text><text x="72" y="126" font-size="35">残る関門を、地図で数える。</text><path d="M73 145q306 5 672-2" stroke="#a28b5b" fill="none"/>
