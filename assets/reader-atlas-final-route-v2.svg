<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">残る関門を、地図で数える。</title><desc id="desc">先読みで見た四つの関門。ファルム・アズラのマリケス、その先の灰都でギデオン、ゴッドフレイ、黄金樹で最後の二連戦。</desc><defs>
