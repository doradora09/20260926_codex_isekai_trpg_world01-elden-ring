href="#tree" transform="translate(174 653) scale(0.75)" filter="url(#ink-waver)"/><path d="M95 827Q111 768 119 677T96 486Q87 399 119 325" fill="none" stroke="#9d8b65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><use href="#church" transform="translate(270 738) scale(1.2)" filter="url(#ink-waver)"/><use href="#gate" transform="translate(423 567) scale(1.05)" filter="url(#ink-waver)"/><use href="#camp" transform="translate(388 446) scale(1)" filter="url(#ink-waver)"/><use href="#castle" transform="translate(227 254) scale(1.4)" filter="url(#ink-waver)"/><text x="112" y="798" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 112 798)">エレの教会</text><text x="112" y="828" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 112 828)">帰る場所</text><text x="465" y="590" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 465 590)">関門前</text><text x="465" y="620" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 465 620)">二隊の育成と、祝福の足場</text><text x="427" y="450" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 427 450)">嵐丘の小屋</text><text x="93" y="204" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 93 204)">ストームヴィル城</text><use href="#gate" transform="translate(284 352) scale(1)" filter="url(#ink-waver)"/><text x="347" y="345" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 347 345)">城へ向かう隧道</text><path d="M288 708Q329 660 389 603T389 480Q356 427 303 382T243 294" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M288 708Q329 660 389 603T389 480Q356 427 303 382T243 294" fill="none" stroke="#536b52" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#route-end)"/><circle cx="747" cy="293" r="46" fill="none" stroke="#887653" stroke-width="2" stroke-dasharray="3 5"/><use href="#grace" transform="translate(747 295) scale(1)" filter="url(#ink-waver)"/><text x="655" y="373" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 655 373)">大祝福の円卓</text><text x="655" y="403" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 655 403)">招かれた者の、別の補給先</text><text x="655" y="430" font-size="17" fill="#66553d" text-anchor="start">この道の続きではない</text><circle cx="326" cy="741" r="23" fill="#e4d3a1" stroke="#925846" stroke-width="2"/><circle cx="326" cy="741" r="6" fill="#925846"/><path d="M300 744q-8-31 30-31" fill="none" stroke="#925846" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="472" y="205" font-size="25" fill="#925846" text-anchor="start" transform="rotate(-2 472 205)">城の内側へ</text><text x="472" y="235" font-size="18" fill="#925846" text-anchor="start" transform="rotate(-2 472 235)">ゴドリックへ届く道を探す</text><path d="M247 690Q59 482 256 366" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M247 690Q59 482 256 366" fill="none" stroke="#9b742f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><text x="76" y="523" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 76 523)">主力十三人</text><text x="76" y="553" font-size="18" fill="#9b742f" text-anchor="start" transform="rotate(-2 76 553)">登録した祝福へ</text><text x="440" y="846" font-size="25" fill="#536b52" text-anchor="start" transform="rotate(-2 440 846)">教会には、二十人が残る。</text>
<path d="M72 902q394 5 853-2" fill="none" stroke="#9b8455"/><text x="72" y="934" font-size="19">金の点線：祝福で移動　　北の城内：これから探索　　朱の丸：拠点</text><text x="72" y="964" font-size="16" fill="#7d7258">地形と位置は概略。その時点の記録で描いた作戦用の略図です。</text></g></svg>