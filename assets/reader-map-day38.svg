<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">DAY38 先生の偵察地図</title><desc id="desc">教会を拠点に嵐の関門、小屋、城前と第三マリカ教会へ。霧の先の城内は未踏。</desc><defs><pattern id="paper" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M0 10h32M12 0v32" stroke="#735a3510" stroke-width="1"/></pattern></defs><rect width="1000" height="780" rx="12" fill="#e4d7b7"/><rect x="20" y="20" width="960" height="740" rx="9" fill="url(#paper)" stroke="#9c835c"/><g font-family="Hiragino Mincho ProN,Yu Mincho,serif" fill="#41372c"><text x="60" y="72" font-size="30">歩いた道。まだ、越えていない門。</text><text x="65" y="108" font-size="18">DAY 38・帰還報告　／　距離・方角を省略した略図</text><g fill="none" stroke="#6b725b" stroke-width="7" stroke-linecap="round"><path d="M180 605 Q120 475 210 420T270 320 L240 215"/><path d="M180 605 Q360 610 490 560 T790 420"/></g><path d="M240 215 L420 205" stroke="#a37c40" stroke-width="5" stroke-dasharray="9 10"/><path d="M480 205h180" stroke="#ab9b80" stroke-width="4" stroke-dasharray="4 12"/><g font-size="21"><circle cx="180" cy="605" r="14" fill="#c4983a"/><text x="65" y="650">エレの教会</text><text x="65" y="679" font-size="16">帰る場所／20人が支える</text><circle cx="210" cy="420" r="12" fill="#c4983a"/><text x="60" y="400">関門前</text><text x="230" y="435" font-size="17">二隊が通常兵で育成</text><path d="M250 330v-35h40v35" stroke="#645a49" stroke-width="4" fill="none"/><text x="307" y="316">嵐の関門を通過</text><circle cx="240" cy="215" r="13" fill="#e4d7b7" stroke="#96722e" stroke-width="3"/><text x="70" y="190">嵐丘の小屋</text><text x="68" y="240" font-size="16">ローデリカに会う</text><rect x="420" y="179" width="70" height="50" rx="12" fill="#dedbcd" stroke="#72555a" stroke-width="3"/><text x="385" y="160">霧の手前まで</text><text x="382" y="265" fill="#8b4047">マルギットが道を塞ぐ</text><path d="M665 188v-44h30v16h32v-16h30v16h28v-16h30v90H665" fill="#b7aa92" stroke="#857560" stroke-width="3"/><text x="650" y="275">ストームヴィル城</text><text x="661" y="304" fill="#8b4047" font-size="18">城内・脇道とも、未踏</text><circle cx="490" cy="560" r="12" fill="#e4d7b7" stroke="#96722e" stroke-width="3"/><text x="412" y="610">アギール湖北</text><text x="413" y="638" font-size="16">未解放／救援用に残す</text><circle cx="790" cy="420" r="13" fill="#e4d7b7" stroke="#96722e" stroke-width="3"/><text x="689" y="470">第三マリカ教会</text><text x="664" y="502" font-size="16">接近・確認／移住は未決定</text></g><path d="M60 717h50" stroke="#6b725b" stroke-width="5"/><text x="126" y="724" font-size="16">実際に通った道</text><circle cx="379" cy="718" r="9" fill="#e4d7b7" stroke="#96722e" stroke-width="2"/><text x="404" y="724" font-size="16">光は確認、未解放</text><text x="675" y="724" font-size="16">次の赤月：DAY40</text></g></svg>