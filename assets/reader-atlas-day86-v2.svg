<path d="M72 902q394 5 853-2" fill="none" stroke="#9b8455"/><text x="72" y="934" font-size="19">離れた土地を結ぶのは、登録済みの祝福。線は実際の街道ではありません。</text><text x="72" y="964" font-size="16" fill="#7d7258">地形と位置は概略。その時点の記録で描いた作戦用の略図です。</text></g></svg>