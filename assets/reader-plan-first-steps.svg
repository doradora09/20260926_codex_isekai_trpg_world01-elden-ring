<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 650" role="img" aria-labelledby="title desc"><title id="title">先生の最初の行動順</title><desc id="desc">戦いを避け、教会を目指し、水と食料を確保する。その後、祝福とレベルアップの仕組みを確かめる。</desc><style>text{fill:#eadfc6;font-family:serif}.sub{font-size:18px;fill:#b8c8c2}.big{font-size:27px}.box{fill:#223534;stroke:#a99467}</style><rect x="12" y="12" width="516" height="626" rx="8" fill="#19282c" stroke="#ad9764"/><text x="42" y="60" font-size="25">皆を、明日へ連れていく。</text><text x="43" y="93" class="sub">先生の頭の中 ／ 最初の行動順</text><path d="M270 150V542" stroke="#b59c69" stroke-width="3" stroke-dasharray="5 8"/><rect class="box" x="42" y="119" width="456" height="85" rx="6"/><text x="68" y="155" class="big">01　騎士の道から離れる</text><text x="68" y="184" class="sub">倒せるかではなく、今は戦わない。</text><rect class="box" x="42" y="225" width="456" height="85" rx="6"/><text x="68" y="261" class="big">02　教会を目指す</text><text x="68" y="290" class="sub">人数、見張り、戻る場所。</text><rect class="box" x="42" y="331" width="456" height="85" rx="6"/><text x="68" y="367" class="big">03　暮らすために集める</text><text x="68" y="396" class="sub">水、食料、寝床。三十三人の分。</text><rect class="box" x="42" y="437" width="456" height="85" rx="6"/><text x="68" y="473" class="big">04　強くなる手順を知る</text><text x="68" y="502" class="sub">祝福と、力を貸してくれる人。</text><text x="45" y="573" class="sub">記憶の中の順番が、正しいとは限らない。</text><text x="45" y="606" class="sub">確かめながら、次の一歩を決める。</text></svg>
