<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">城の向こうに、湖が広がる。</title><desc id="desc">ストームヴィル城を越えた先生はリエーニエを先行偵察。A・B隊は教会の二十人を護衛して城の祝福を登録する。</desc><defs>
