linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><text x="478" y="684" font-size="25" fill="#66553d" text-anchor="start" transform="rotate(-2 478 684)">A・B隊の護衛</text><text x="478" y="714" font-size="18" fill="#66553d" text-anchor="start" transform="rotate(-2 478 714)">自分の足で来て、触れる</text><path d="M402 494Q536 468 478 399" fill="none" stroke="#ecddbd" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M402 494Q536 468 478 399" fill="none" stroke="#9b742f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 9" marker-end="url(#route-end)"/><text x="585" y="451" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 585 451)">先生だけ、先へ</text><text x="585" y="481" font-size="18" fill="#9b742f" text-anchor="start" transform="rotate(-2 585 481)">湖の道と地図を確かめる</text><text x="370" y="200" font-size="25" fill="#9b742f" text-anchor="start" transform="rotate(-2 370 200)">この先は、まだ白い。</text><use href="#tree" transform="translate(649 578) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(692 598) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(721 555) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(794 730) scale(0.75)" filter="url(#ink-waver)"/><use href="#tree" transform="translate(757 763) scale(0.75)" filter="url(#ink-waver)"/><circle cx="341" cy="745" r="23" fill="#e4d3a1" stroke="#925846" stroke-width="2"/><circle cx="341" cy="745" r="6" fill="#925846"/><path d="M315 748q-8-31 30-31" fill="none" stroke="#925846" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M72 902q394 5 853-2" fill="none" stroke="#9b8455"/><text x="72" y="934" font-size="19">城の向こう：先生の偵察　　城への道：仲間の護衛　　まだ知らない先は余白</text><text x="72" y="964" font-size="16" fill="#7d7258">地形と位置は概略。その時点の記録で描いた作戦用の略図です。</text></g></svg>