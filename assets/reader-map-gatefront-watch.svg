<path d="M66 786h903" stroke="#8d7c59"/><text x="68" y="821" font-size="18">太線＝歩いて確かめた道　／　点線＝生活の往復・未確認の先　／　余白＝未知</text><text x="68" y="848" font-size="16" fill="#7b7058">読者用の略図。位置と縮尺は概略で、その時点の知識だけを記載。</text></g></svg>