<text x="858" y="722" font-size="23">アギール湖</text><text x="828" y="754" font-size="17">岸と水面は別に確かめる</text>
<path d="M335 608Q431 555 415 487T480 358" fill="none" stroke="#5e6855" stroke-width="5" marker-end="url(#arrow)"/><circle cx="486" cy="331" r="11" fill="#655c46"/><text x="398" y="303" font-size="21">遮蔽から観測</text><circle cx="525" cy="237" r="7" fill="#8d5942"/><circle cx="590" cy="221" r="7" fill="#8d5942"/><text x="626" y="244" font-size="21">同時に見た兵：二人</text><path d="M455 207q96-78 198-36" fill="none" stroke="#8b7650" stroke-width="2" stroke-dasharray="6 8"/><text x="364" y="184" font-size="21">尾根の向こうは、まだ見えない</text><text x="598" y="399" font-size="23" fill="#96733f">目標：関門前の祝福</text><text x="598" y="432" font-size="19">位置・最後の経路は未確認</text><path d="M362 652Q594 738 791 631" fill="none" stroke="#778677" stroke-width="3" stroke-dasharray="9 9"/><text x="514" y="706" font-size="19">水を汲み、暮らしをつなぐ</text>
